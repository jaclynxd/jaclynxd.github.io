<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrantes del equipo</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .equipo {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .integrante {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      width: 220px;
      padding: 16px;
      text-align: center;
    }
    .integrante img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ddd;
    }
    .integrante h2 {
      font-size: 1.1rem;
      margin: 12px 0 4px;
    }
    .integrante a {
      font-size: 0.85rem;
      color: #0366d6;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Integrantes del equipo</h1>

  <ul class="equipo">

    <!-- Vergara Andrade Jaqueline -->
    <li class="integrante">
      <img src="https://raw.githubusercontent.com/jaclynxd/jaclynxd.github.io/refs/heads/main/Imagenes/Cruz%20Cervera%20Joselyn%20Lilian.jpg" alt="Foto del integrante 1">
      <h2>Vergara Andrade Jaqueline</h2>
      <a href="https://raw.githubusercontent.com/jaclynxd/jaclynxd.github.io/refs/heads/main/Imagenes/Cruz%20Cervera%20Joselyn%20Lilian.jpg" target="_blank">Ver imagen</a>
    </li>

    <!-- Cruz Cervera Joselyn Lilian -->
    <li class="integrante">
      <img src="https://raw.githubusercontent.com/jaclynxd/jaclynxd.github.io/refs/heads/main/Imagenes/Vergara%20Andrade%20Jaqueline.jpg" alt="Foto del integrante 2">
      <h2>Cruz Cervera Joselyn Lilian</h2>
      <a href="https://raw.githubusercontent.com/jaclynxd/jaclynxd.github.io/refs/heads/main/Imagenes/Vergara%20Andrade%20Jaqueline.jpg"_blank">Ver imagen</a>
    </li>

  </ul>

</body>
</html>
</html>
